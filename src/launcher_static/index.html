<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwenox 启动器</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#e8ecf6; --dim:#9aa6c0; --faint:#6c7893;
  --line:rgba(120,140,190,.22); --line2:rgba(130,150,200,.42);
  --card:rgba(12,17,32,.86); --card2:rgba(8,12,24,.9); --inp:rgba(7,10,22,.82);
  --hover:rgba(80,110,200,.16); --sel:rgba(59,95,184,.32);
  --accent:#7aa2f0; --btn:#3b5fb8; --btn-hi:#4f7ad9;
  --ok:#5fc98a; --bad:#ff7a7a; --warn:#e8b95f;
  --mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);
  font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:#0a0e1a url(/media/panel-bg.png) center/cover fixed no-repeat;
  display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;background:rgba(8,12,26,.5);pointer-events:none}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}

/* ---- 顶栏 ---- */
header{position:relative;z-index:3;display:flex;align-items:center;gap:12px;
  padding:10px 20px;flex:0 0 auto;flex-wrap:wrap}
h1{font-size:17px;margin:0;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;
  background:rgba(10,14,28,.7);border:1px solid var(--line);font-size:13px;min-width:0}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.pill .stt{font-weight:600;white-space:nowrap}
.pill .sub{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
.st-running .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.st-running .stt{color:var(--ok)}
.st-busy .dot{background:var(--warn);animation:blink 1.1s infinite}
.st-busy .stt{color:var(--warn)}
.st-bad .dot{background:var(--bad)} .st-bad .stt{color:var(--bad)}
@keyframes blink{50%{opacity:.25}}
.spacer{flex:1}
.restart-hint{color:var(--warn);font-size:12.5px;white-space:nowrap}

/* ---- 按钮 ---- */
.btn{background:var(--btn);color:#fff;border:1px solid rgba(140,165,240,.35);border-radius:6px;
  padding:6px 16px;font-size:13.5px;cursor:pointer;white-space:nowrap;line-height:1.4}
.btn:hover{background:var(--btn-hi)}
.btn:disabled{opacity:.4;cursor:not-allowed}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn.ghost{background:rgba(16,22,40,.72);color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{background:rgba(40,56,100,.6)}
.btn.danger{background:#7a3440;border-color:rgba(240,150,150,.3)}
.btn.danger:hover{background:#94404d}
.btn.warnb{background:#8a6420;border-color:rgba(240,200,120,.4)}
.btn.warnb:hover{background:#a3772a}
.btn.mini{padding:3px 10px;font-size:12px;border-radius:5px}
.btn.big{padding:7px 22px;font-weight:600}
.iconbtn{background:none;border:none;color:var(--dim);cursor:pointer;padding:2px 5px;
  border-radius:4px;font-size:13px;line-height:1}
.iconbtn:hover{color:var(--ink);background:var(--hover)}

/* ---- 布局 ---- */
main{position:relative;z-index:1;flex:1;min-height:0;display:flex;gap:14px;
  padding:0 20px 18px;width:100%;max-width:1320px;margin:0 auto}
aside{flex:0 0 250px;display:flex;flex-direction:column;min-height:0;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden}
.work{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden}

/* ---- 方案栏 ---- */
.side-head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px}
.side-head h2{margin:0;font-size:13px;color:var(--dim);letter-spacing:.1em;flex:1}
.plist{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 8px}
.pitem{position:relative;padding:8px 10px 8px 12px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;margin-bottom:4px}
.pitem:hover{background:var(--hover)}
.pitem.on{background:var(--sel);border-color:rgba(122,162,240,.55)}
.pitem.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;
  border-radius:2px;background:var(--accent)}
.pname{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.pname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .tag{font-size:10.5px;font-weight:600;border-radius:4px;padding:0 5px;flex:0 0 auto}
.tag.run{color:var(--ok);border:1px solid rgba(95,201,138,.6)}
.tag.mod{color:var(--warn);border:1px solid rgba(232,185,95,.6)}
.psum{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfile{font:11px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pacts{position:absolute;right:6px;top:6px;display:none;gap:1px;
  background:rgba(12,17,32,.92);border-radius:5px}
.pitem:hover .pacts{display:flex}
.pitem.unsaved{border:1px dashed var(--line2)}
.pitem.unsaved .pname{color:var(--dim)}
.pempty{color:var(--dim);font-size:12.5px;padding:8px 10px}
.side-foot{padding:8px 12px 12px;border-top:1px solid var(--line);display:flex;justify-content:center}

/* ---- 页签 ---- */
.tabs{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{padding:7px 16px 8px;cursor:pointer;color:var(--dim);font-weight:600;user-select:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;
  white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-size:10.5px;background:rgba(232,185,95,.2);color:var(--warn);border-radius:8px;
  padding:0 6px;font-weight:600}
.tab .cnt.err{background:rgba(255,122,122,.2);color:var(--bad)}
.tab.r .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.tab.r .dot.ok{background:var(--ok)} .tab.r .dot.busy{background:var(--warn)}
.tab.r .dot.bad{background:var(--bad)}
.tabs .ctxname{margin-left:auto;align-self:center;font-size:12px;color:var(--dim);
  padding-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}

.pane{flex:1;min-height:0;overflow-y:auto;padding:6px 22px 18px}
.note{font-size:12.5px;color:var(--dim);background:rgba(122,162,240,.08);
  border:1px solid rgba(122,162,240,.2);border-radius:7px;padding:7px 12px;margin:12px 0 4px}
h3{font-size:12.5px;margin:18px 0 4px;color:var(--dim);font-weight:600;letter-spacing:.08em;
  padding-bottom:4px;border-bottom:1px solid var(--line)}

/* ---- 字段行 ---- */
.frow{display:grid;grid-template-columns:200px minmax(0,1fr);gap:4px 16px;
  padding:8px 10px;margin:0 -10px;border-radius:7px;position:relative}
.frow:hover{background:rgba(80,110,200,.06)}
.frow.dirty{background:rgba(232,185,95,.06)}
.frow.dirty::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:2px;background:var(--warn)}
.frow.bad::before{background:var(--bad)}
.flab{padding-top:4px;min-width:0}
.fname{font-weight:600;font-size:13.5px}
.fkey{font:11px var(--mono);color:var(--faint);overflow-wrap:anywhere}
.fctl{min-width:0}
.fline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fhelp{font-size:12px;color:var(--dim);margin-top:3px}
.fmsg{font-size:12px;margin-top:3px;display:none}
.fmsg.err{display:block;color:var(--bad)}
.fmsg.warn{display:block;color:var(--warn)}
.fmsg.info{display:block;color:var(--dim)}
.ex{font-size:12px;white-space:nowrap}
.ex.ok{color:var(--ok)} .ex.no{color:var(--warn)}
.reset{visibility:hidden}
.frow.dirty .reset{visibility:visible}
input[type=text]{flex:1;min-width:140px;background:var(--inp);border:1px solid var(--line2);
  border-radius:5px;padding:5px 9px;font:13px var(--mono)}
input.num{flex:0 0 150px;min-width:0}
select{background:var(--inp);border:1px solid var(--line2);border-radius:5px;padding:5px 8px;
  font-size:13px;min-width:180px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input:disabled,select:disabled{opacity:.42}
.frow.bad input[type=text]{border-color:rgba(255,122,122,.7)}
.envtag{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 5px}
.unit{color:var(--dim);font-size:12.5px}

/* 双端区间滑条（控制向量层区间）：两条 range 叠在同一轨道上，只让拇指响应指针。
   rail 左右各内缩 8px（= 一半拇指宽），fill 的百分比就与拇指中心严格对齐。 */
.rng2{position:relative;width:min(420px,100%);height:26px;flex:1 1 260px;min-width:200px}
.rng2 .rail{position:absolute;left:8px;right:8px;top:11px;height:4px;border-radius:2px;
  background:var(--line2)}
.rng2 .fill{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.rng2 input[type=range]{position:absolute;left:0;right:0;top:0;width:100%;height:26px;margin:0;
  background:transparent;pointer-events:none;-webkit-appearance:none;appearance:none}
.rng2 input[type=range]:focus{outline:none}
.rng2 input[type=range]::-webkit-slider-runnable-track{background:transparent;height:26px}
.rng2 input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;
  width:16px;height:16px;margin-top:5px;border-radius:50%;background:var(--accent);
  border:2px solid #0b1020;box-shadow:0 0 0 1px var(--line2);cursor:pointer}
.rng2 input[type=range]::-moz-range-track{background:transparent;height:26px}
.rng2 input[type=range]::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;
  border-radius:50%;background:var(--accent);border:2px solid #0b1020;cursor:pointer}
.rng2 input[type=range]:disabled::-webkit-slider-thumb{background:var(--faint);cursor:default}
.rng2 input[type=range]:disabled::-moz-range-thumb{background:var(--faint);cursor:default}
.rng2val{font:12.5px var(--mono);color:var(--dim);min-width:74px;text-align:right}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:rgba(16,22,40,.6);border-radius:5px;
  padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--sel);border-color:var(--accent);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{background:rgba(16,22,40,.6);border:none;border-right:1px solid var(--line);
  padding:5px 13px;cursor:pointer;font-size:13px}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--btn);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.wvcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 6px}
.wvc{border:1px solid var(--line2);border-radius:8px;padding:9px 12px;cursor:pointer;
  background:rgba(16,22,40,.5)}
.wvc:hover{border-color:var(--accent)}
.wvc.on{border-color:var(--accent);background:var(--sel);box-shadow:0 0 10px rgba(90,130,230,.22)}
.wvc b{display:block;font-size:14px}
.wvc span{font-size:12px;color:var(--dim)}
/* 开关 */
.sw{position:relative;display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .tr{width:34px;height:19px;border-radius:10px;background:rgba(90,100,130,.55);
  position:relative;transition:background .15s;flex:0 0 auto}
.sw .tr::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;
  background:#dfe5f3;transition:left .15s}
.sw input:checked + .tr{background:var(--btn-hi)}
.sw input:checked + .tr::after{left:17px}
.sw input:disabled + .tr{opacity:.4}
.sw input:focus-visible + .tr{outline:2px solid var(--accent);outline-offset:2px}
.sw .lb{font-size:12.5px;color:var(--dim)}

/* ---- 保存栏 ---- */
.savebar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px;
  border-top:1px solid var(--line);background:var(--card2);flex-wrap:wrap}
.savebar .msg{flex:1;min-width:180px;font-size:13px;color:var(--dim)}
.savebar.dirty .msg{color:var(--warn)}
.savebar.bad .msg{color:var(--bad)}
.savebar .msg .keys{font:11.5px var(--mono);color:var(--faint);margin-left:6px}
.kbd{font:11px var(--mono);border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--faint)}

/* ---- 运行页 ---- */
.runtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:14px}
.box{border:1px solid var(--line);border-radius:9px;padding:11px 14px;background:rgba(8,12,24,.45);min-width:0}
.box h4{margin:0 0 6px;font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.06em}
.bigstate{font-size:20px;font-weight:700}
.kv{font-size:12.5px;color:var(--dim);overflow-wrap:anywhere}
.pf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:12.5px}
.pf .i{font-weight:700;text-align:center;width:16px}
.pf .i.ok{color:var(--ok)} .pf .i.bad{color:var(--bad)} .pf .i.skip{color:var(--faint)}
.pf .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .t small{color:var(--faint);font-family:var(--mono)}
.logbar{display:flex;align-items:center;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.logbar .path{font:11.5px var(--mono);color:var(--faint);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre#log{background:var(--card2);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap;
  word-break:break-all;overflow:auto;height:calc(100vh - 430px);min-height:200px}
.runpane{display:flex;flex-direction:column}

/* ---- 提示条 ---- */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;
  max-width:min(680px,92vw);border-radius:7px;padding:8px 16px;font-size:13px;cursor:pointer;
  box-shadow:0 6px 24px rgba(0,0,0,.5);display:none;transition:opacity .35s}
#toast.ok{display:block;background:rgba(22,56,38,.95);color:#c9ecd4;border:1px solid rgba(95,201,138,.5)}
#toast.err{display:block;background:rgba(70,26,34,.95);color:#ffc9c9;border:1px solid rgba(240,150,150,.5)}

/* ---- 对话框 / 文件浏览器 ---- */
.modal{position:fixed;inset:0;background:rgba(4,6,14,.62);z-index:100;display:flex;
  align-items:center;justify-content:center}
.mcard{width:min(460px,92vw);background:var(--card2);border:1px solid var(--line2);border-radius:11px;
  box-shadow:0 18px 60px rgba(0,0,0,.6);padding:18px 20px 16px}
.mcard h4{margin:0 0 8px;font-size:15.5px}
.mcard .mb{font-size:13px;color:var(--dim);margin-bottom:12px;white-space:pre-line}
.mcard input[type=text]{width:100%;font-family:inherit;font-size:14px;padding:7px 10px}
.mcard .mh{font-size:12px;min-height:18px;margin-top:5px;color:var(--dim)}
.mcard .mh.warn{color:var(--warn)} .mcard .mh.err{color:var(--bad)}
.mcard .mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.fbcard{width:min(720px,94vw);max-height:80vh;display:flex;flex-direction:column;
  background:var(--card2);border:1px solid var(--line2);border-radius:11px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.fb-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.fb-chips{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fb-list{flex:1;overflow:auto;padding:4px 6px;min-height:200px}
.fb-item{display:flex;gap:8px;align-items:center;padding:4px 10px;border-radius:5px;cursor:pointer;
  font:13px var(--mono)}
.fb-item:hover{background:var(--sel)}
.fb-item.cur{background:rgba(122,162,240,.14)}
.fb-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-item .sz,.fb-item .mt{color:var(--dim);font-size:11.5px;flex:0 0 auto}
.fb-foot{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.fb-foot .small{font-size:12px;color:var(--dim)}

/* ---- 窄窗 ---- */
@media(max-width:1060px){aside{flex-basis:210px}.frow{grid-template-columns:160px minmax(0,1fr)}}
@media(max-width:820px){
  main{flex-direction:column;overflow-y:auto}
  aside{flex:0 0 auto;max-height:220px}
  .work{flex:1 0 520px}
  .frow{grid-template-columns:1fr}
  .flab{display:flex;gap:8px;align-items:baseline;padding-top:0}
  .runtop{grid-template-columns:1fr}
  .wvcards{grid-template-columns:1fr}
  .pill .sub{max-width:160px}
}
</style>
</head>
<body>
<header>
  <h1>Qwenox <span data-i18n="title">启动器</span></h1>
  <span class="pill" id="pill"><span class="dot"></span><span class="stt">—</span><span class="sub"></span></span>
  <span class="spacer"></span>
  <span class="restart-hint" id="restartHint" style="display:none"></span>
  <span id="hdrBtns" style="display:flex;gap:8px"></span>
  <span id="consoleLink"></span>
  <button class="btn ghost" id="langBtn">EN</button>
</header>
<main>
  <aside>
    <div class="side-head">
      <h2 data-i18n="profiles">方案</h2>
      <button class="btn ghost mini" id="btnNew" data-i18n="new_pf">＋ 新建</button>
    </div>
    <div class="plist" id="plist"></div>
    <div class="side-foot"><button class="btn ghost mini" id="btnQuit" data-i18n="quit">退出启动器</button></div>
  </aside>
  <section class="work">
    <div class="tabs" id="tabs"></div>
    <div class="pane" id="pane"></div>
    <div class="savebar" id="savebar"></div>
  </section>
</main>
<div id="toast"></div>
<div id="modalHost"></div>

<script>
"use strict";
// ============================================================================
// 文案
// ============================================================================
const T = {
zh:{
  title:"启动器", profiles:"方案", new_pf:"＋ 新建", quit:"退出启动器",
  tab_w:"权重", tab_i:"推理设置", tab_m:"本机设置", tab_r:"运行与日志",
  unsaved_name:"当前配置", unsaved_sub:"尚未存为方案", store_pf:"存为方案…",
  no_pf:"还没有方案。改好配置后点「＋ 新建」存一个。",
  t_run:"运行中", t_mod:"有修改",
  act_rename:"重命名", act_dup:"复制", act_del:"删除",
  editing:"正在编辑：", editing_unsaved:"正在编辑：当前配置（未存为方案）",
  w_note:"选中的方案就是下次启动用的配置。点左侧方案即切换；这里的修改先存在草稿里，点「保存」才写入。",
  i_note:"推理设置属于方案，跟权重一起保存、一起切换。",
  m_note:"本机设置不属于任何方案，所有方案共用（端口、请求日志）。",
  wv_title:"权重格式",
  wv_v1:"V1", wv_v1s:"w4b 单文件 + 可选 overlay",
  wv_v2:"V2", wv_v2s:"主模型 + 独立 n-gram 表",
  wv_gguf:"GGUF", wv_ggufs:"分片 GGUF，内嵌词表",

function t(k, vars){
  let s = T[LANG][k]; if (s === undefined) s = T.zh[k]; if (s === undefined) s = k;
  if (vars && typeof s === "string") s = s.replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? "");
  return s;
}

  {k:"API_PORT", tab:"m", grp:"net", type:"int", nameZh:"API 端口", nameEn:"API port"},
  {k:"ENGINE_HOST", tab:"m", grp:"net", type:"text", nameZh:"引擎监听地址", nameEn:"Engine bind address",
   helpZh:"引擎行协议，默认仅本机", helpEn:"Engine line protocol; local only by default"},
  {k:"ENGINE_PORT", tab:"m", grp:"net", type:"int", nameZh:"引擎端口", nameEn:"Engine port"},
  // ---- 本机：请求日志 ----
  {k:"REQLOG", tab:"m", grp:"reqlog", type:"check", nameZh:"记录请求", nameEn:"Log requests",
   helpZh:"完整请求/响应写入 ZIP，注意隐私和磁盘占用", helpEn:"Full requests/responses to ZIP — mind privacy and disk"},
  {k:"REQLOG_DIR", tab:"m", grp:"reqlog", type:"dir", nameZh:"日志目录", nameEn:"Log directory"},
  {k:"REQLOG_LEVEL", tab:"m", grp:"reqlog", type:"int", nameZh:"详细度", nameEn:"Verbosity", helpZh:"0–9", helpEn:"0–9"},
];
const GROUPS = {
  ctx:["上下文与并发","Context & concurrency"], cache:["SSD prompt 缓存","SSD prompt cache"],
  misc:["推理选项","Inference options"], guard:["启动保护","Startup guards"],
  net:["网络与端口","Network & ports"], reqlog:["请求日志（注意隐私）","Request logging (privacy)"],
};
const FMAP = Object.fromEntries(FIELDS.map(f => [f.k, f]));
const RANGES = {ENGINE_PORT:[1,65535], API_PORT:[1,65535], MAX_CONTEXT:[1024,1048576], PARALLEL:[1,8],
  KV_POOL_TOKENS:[0,16777216], PREFILL_CHUNK:[0,1048576], CONC_PREFILL_CHUNK:[0,1048576],
  KVSNAP_MAX_GB:[0,65536], MAX_IMAGES:[1,256], REQLOG_LEVEL:[0,9], MEMORY_CAP_GB:[1,2048],
  MIN_AVAILABLE_GB:[1,4096], START_TIMEOUT:[30,86400], STALL_TIMEOUT:[5,3600]};
// 方案收哪些键（与后端 kProfileKeys 一致；网络/请求日志属本机，不进方案）
// 控制向量（CVEC*）与权重版本无关，三种格式都纳入方案。
const PF_CVEC = ["CVEC","CVEC_MODE","CVEC_SCALE","CVEC_LAYERS"];
const PF_WKEYS = {
  v1:["MODEL_FILE","OVERLAY_FILE","MTP_FILE","VISION_FILE","TOKENIZER_DIR",...PF_CVEC],
  v2:["MODEL_FILE","NGRAM_FILE","VISION_FILE","TOKENIZER_DIR",...PF_CVEC],
  gguf:["GGUF_FILE","GGUF_MTP_FILE","GGUF_VISION_FILE","GGUF_PLE_FILE","TOKENIZER_DIR",...PF_CVEC],
};
const PF_IKEYS = FIELDS.filter(f => f.tab === "i").map(f => f.k);
const ACTIVE = ["spawning","waiting_engine","waiting_api","running","stopping"];

  base:null, draft:null,                       // {wv, v:{k:值}, on:{k:启用}}；base = 已保存
  tab:"w", svc:{state:"idle"}, ex:{}, logWhich:"engine", follow:true,
};
const LS = {
  get(k){ try{ return localStorage.getItem("qxl." + k); }catch(e){ return null; } },
  set(k, v){ try{ v == null ? localStorage.removeItem("qxl." + k) : localStorage.setItem("qxl." + k, v); }catch(e){} },
};

const $ = s => document.querySelector(s);
function el(tag, attrs, kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k in e && typeof v !== "string") e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of [].concat(kids ?? [])){
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

async function api(path, method, body){
  const opt = {method: method || "GET"};
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || (path + " → " + r.status));
  return j;
}

let toastTimer = null;

  clearTimeout(toastTimer);
  n.style.opacity = "";
  n.className = msg ? (isErr ? "err" : "ok") : "";
  n.textContent = msg || "";
  if (msg && !isErr) toastTimer = setTimeout(() => {
    n.style.opacity = "0";
    setTimeout(() => { n.className = ""; n.style.opacity = ""; }, 380);
  }, 3500);
}

// 草稿与比较
// ============================================================================
const isEnv = k => (S.cfg?.env_overridden || []).includes(k);
const fieldOn = f => (!f.plat || f.plat === S.plat);
const fieldVisible = (f, wv) => fieldOn(f) && (!f.wv || f.wv.includes(wv));

function draftFromCfg(){
  const c = S.cfg, d = {wv: c.weights_ver || "v2", v:{}, on:{}};
  for (const f of FIELDS){
    const v = (c.values && f.k in c.values) ? String(c.values[f.k]) : "";
    d.v[f.k] = v;
    if (f.opt){ d.on[f.k] = v !== ""; if (!v) d.v[f.k] = (c.defaults && c.defaults[f.k]) || ""; }
  }
  return d;
}
const clone = d => ({wv:d.wv, v:{...d.v}, on:{...d.on}});

// 字段的生效值（落盘值）
function eff(d, k){
  const f = FMAP[k];
  if (f.opt && !d.on[k]) return "";
  let v = String(d.v[k] ?? "").trim();
  if (v === "" && (f.type === "int" || f.type === "ctx" || f.type === "par"))
    v = (S.cfg?.defaults && S.cfg.defaults[k]) || "";
  return v;
}

function dirtyKeys(){
  if (!S.base || !S.draft) return [];
  const out = [];
  if (S.draft.wv !== S.base.wv) out.push("weights_ver");
  for (const f of FIELDS){
    if (!fieldVisible(f, S.draft.wv) || isEnv(f.k)) continue;
    if (eff(S.draft, f.k) !== eff(S.base, f.k)) out.push(f.k);
  }
  return out;
}
const isDirty = () => dirtyKeys().length > 0;

// ---- 校验 ----
const parseIntStrict = s => /^-?\d+$/.test(s) ? parseInt(s, 10) : NaN;
const IPV4 = /^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/;
function validate(d){
  const err = {};
  const vis = f => fieldVisible(f, d.wv) && !isEnv(f.k);
  for (const f of FIELDS){
    if (!vis(f)) continue;
    const v = eff(d, f.k);
    if (["int","ctx","par"].includes(f.type)){
      const n = parseIntStrict(v);
      if (Number.isNaN(n)){ err[f.k] = t("v_int"); continue; }
      const r = RANGES[f.k];
      if (r && (n < r[0] || n > r[1])) err[f.k] = t("v_range", {a:r[0], b:r[1]});
    } else if (f.type === "range"){
      const p = String(v).trim().split(/[\s,]+/).map(Number);
      if (p.length !== 2 || !(p[0] >= f.min && p[1] >= p[0] && p[1] <= f.max))
        err[f.k] = t("v_cvec_layers");
    } else if ((f.type === "file" || f.type === "dir") && f.req && !v){
      err[f.k] = t("v_req");
    } else if (f.k === "API_HOST" || f.k === "ENGINE_HOST"){
      if (!IPV4.test(v)) err[f.k] = t("v_ip");
    } else if (f.type === "affinity" && v && v !== "lower-half" && v !== "upper-half"){
      const n = /^0x[0-9a-f]+$/i.test(v) ? parseInt(v, 16) : parseIntStrict(v);
      if (!n || n < 0) err[f.k] = t("v_aff");
    }
  }
  const n = k => parseIntStrict(eff(d, k));
  if (!err.API_PORT && !err.ENGINE_PORT && n("API_PORT") === n("ENGINE_PORT")) err.API_PORT = t("v_port");
  if (!err.PARALLEL && n("PARALLEL") > 1 && eff(d, "KV_PAGED") !== "1") err.PARALLEL = t("v_par");
  const poolMax = eff(d, "KV_TYPE") === "q8" ? 1048576 : 524288;
  if (!err.MAX_CONTEXT && !err.KV_POOL_TOKENS && Math.max(n("MAX_CONTEXT"), n("KV_POOL_TOKENS")) > poolMax)
    err[n("MAX_CONTEXT") > poolMax ? "MAX_CONTEXT" : "KV_POOL_TOKENS"] = t("v_pool");
  // 控制向量（CVEC，见 docs/CVEC.md）：只有启用时才校验模式/scale/层区间。
  if (eff(d, "CVEC")) {
    const mode = eff(d, "CVEC_MODE");
    if (mode !== "project" && mode !== "add") err.CVEC_MODE = t("v_cvec_mode");
    const cs = parseFloat(eff(d, "CVEC_SCALE"));
    if (!(cs > 0) || !Number.isFinite(cs)) err.CVEC_SCALE = t("v_cvec_scale");
  }
  return err;
}

function profileFromCfg(){
  const c = S.cfg, wv = c.weights_ver || "v2", data = {weights_ver: wv};
  for (const k of [...PF_WKEYS[wv], ...PF_IKEYS]){
    const f = FMAP[k];
    if (f && !fieldOn(f)) continue;
    if (c.values && k in c.values) data[k] = String(c.values[k]);
  }
  return data;
}
function profileMatches(data){
  const c = S.cfg;
  if (!c || (data.weights_ver || "v2") !== (c.weights_ver || "v2")) return false;
  for (const [k, v] of Object.entries(data)){
    if (k === "weights_ver") continue;
    if (String(c.values?.[k] ?? "") !== String(v)) return false;
  }
  return true;
}
function pickSel(){
  const pref = LS.get("sel");
  if (pref && S.prof[pref] && profileMatches(S.prof[pref])) return pref;
  for (const n of Object.keys(S.prof)) if (profileMatches(S.prof[n])) return n;
  return "";
}
function setSel(n){ S.sel = n; LS.set("sel", n || null); }

function fmtK(n){
  n = parseInt(n, 10);
  if (!n) return "—";
  if (n >= 1048576 && n % 1048576 === 0) return (n / 1048576) + "M";
  if (n % 1024 === 0) return (n / 1024) + "K";
  return String(n);
}
const baseName = p => String(p || "").replace(/\\/g, "/").split("/").pop();
function summarize(data){
  const wv = data.weights_ver || "v2";
  const main = wv === "gguf" ? data.GGUF_FILE : data.MODEL_FILE;
  return {
    line: `${t("wv_" + wv)} · ${fmtK(data.MAX_CONTEXT)} · ${t("sum_par", {n: data.PARALLEL || "?"})}`,
    file: baseName(main),
  };
}

function renderTabs(){
  const host = $("#tabs");
  host.innerHTML = "";
  const dk = dirtyKeys(), errs = validate(S.draft);
  const cnt = tab => {
    const ks = dk.filter(k => tab === "w" ? (k === "weights_ver" || FMAP[k]?.tab === "w") : FMAP[k]?.tab === tab);
    const es = Object.keys(errs).filter(k => FMAP[k]?.tab === tab);
    if (es.length) return el("span", {class:"cnt err", text:es.length});
    if (ks.length) return el("span", {class:"cnt", text:ks.length});
    return null;
  };
  for (const id of ["w","i","m"])
    host.append(el("div", {class:"tab" + (S.tab === id ? " on" : ""), "data-tab":id,
      onclick:() => gotoTab(id)}, [t("tab_" + id), cnt(id)]));
  const st = S.svc.state;
  const dc = st === "running" ? "ok" : ACTIVE.includes(st) ? "busy" : (st === "failed" || st === "exited") ? "bad" : "";
  host.append(el("div", {class:"tab r" + (S.tab === "r" ? " on" : ""), "data-tab":"r",
    onclick:() => gotoTab("r")}, [el("span", {class:"dot " + dc}), t("tab_r")]));

function gotoTab(id){
  S.tab = id;
  renderTabs(); renderPane(); renderSavebar();
  if (id === "r") refreshLog(true);
}

function renderPane(){
  const pane = $("#pane");
  pane.innerHTML = "";
  pane.className = "pane" + (S.tab === "r" ? " runpane" : "");
  if (!S.draft) return;
  if (S.tab === "r") return renderRun(pane);
  if (S.tab === "w"){
    pane.append(el("div", {class:"note", text:t("w_note")}));
    pane.append(el("h3", {text:t("wv_title")}));

    for (const wv of ["v1","v2","gguf"])
      cards.append(el("div", {class:"wvc" + (S.draft.wv === wv ? " on" : ""), onclick:() => {

        [el("b", {text:t("wv_" + wv)}), el("span", {text:t("wv_" + wv + "s")})]));

function setVal(k, v){ S.draft.v[k] = v; changed(); }

function mkRow(f){
  const k = f.k, env = isEnv(k), d = S.draft;
  const line = el("div", {class:"fline"});
  const ctl = el("div", {class:"fctl"}, line);
  const row = el("div", {class:"frow", "data-k":k}, [
    el("div", {class:"flab"}, [el("div", {class:"fname", text:L(f, "name")}), el("div", {class:"fkey", text:k})]),
    ctl]);
  const textInput = (cls) => el("input", {type:"text", class:cls || "", value:d.v[k] ?? "", spellcheck:"false",
    disabled:env, placeholder:(S.cfg.defaults && S.cfg.defaults[k]) || "",
    oninput:ev => setVal(k, ev.target.value)});

  if (f.type === "range"){
    // 双端滑条：值仍以 "lo hi" 字符串落盘/校验（与引擎、启动器 CLI 一致）。
    const mn = f.min, mx = f.max;
    const parse = v => {
      const p = String(v ?? "").trim().split(/[\s,]+/).map(Number);
      let lo = p[0], hi = p[1];
      if (!(lo >= mn && lo <= mx)) lo = 4;
      if (!(hi >= mn && hi <= mx)) hi = 44;
      if (lo > hi) { const t = lo; lo = hi; hi = t; }
      return [lo, hi];
    };
    const [lo0, hi0] = parse(d.v[k]);
    const pct = x => ((x - mn) / (mx - mn)) * 100;
    const wrap = el("div", {class:"rng2"});
    const rail = el("div", {class:"rail"});
    const fill = el("div", {class:"fill"});
    const inLo = el("input", {type:"range", min:mn, max:mx, step:1, value:lo0, disabled:env});
    const inHi = el("input", {type:"range", min:mn, max:mx, step:1, value:hi0, disabled:env});
    const val = el("span", {class:"rng2val"});
    const paint = (lo, hi) => {
      fill.style.left = pct(lo) + "%";
      fill.style.width = (pct(hi) - pct(lo)) + "%";
      val.textContent = lo + " – " + hi;
      // 低端过中线后置顶，保证两端在重叠区间内都还能抓到
      const loFront = pct(lo) > 50;
      inLo.style.zIndex = loFront ? 3 : 2;
      inHi.style.zIndex = loFront ? 2 : 3;
    };
    const commit = (lo, hi) => { paint(lo, hi); setVal(k, lo + " " + hi); };
    inLo.addEventListener("input", () => {           // 拖动中：clamp 低端不越过高端
      const lo = Math.min(+inLo.value, +inHi.value);
      inLo.value = lo; paint(lo, +inHi.value);
    });
    inHi.addEventListener("input", () => {
      const hi = Math.max(+inHi.value, +inLo.value);
      inHi.value = hi; paint(+inLo.value, hi);
    });
    inLo.addEventListener("change", () => commit(+inLo.value, +inHi.value));
    inHi.addEventListener("change", () => commit(+inLo.value, +inHi.value));
    rail.append(fill);
    wrap.append(rail, inLo, inHi);
    line.append(wrap, val);
    paint(lo0, hi0);  // 首帧只画，不写回（避免把默认值当成用户改动）
  } else if (f.type === "check"){
    line.append(mkSwitch(d.v[k] === "1", env, on => setVal(k, on ? "1" : "0")));
  } else if (f.type === "select"){
    const s = el("select", {disabled:env, onchange:ev => setVal(k, ev.target.value)},
      f.opts.map(o => el("option", {value:o[0], text: LANG === "zh" ? o[1] : o[2]})));
    if (!f.opts.some(o => o[0] === d.v[k])) s.append(el("option", {value:d.v[k], text:d.v[k]}));
    s.value = d.v[k];
    line.append(s);
  } else if (f.type === "par"){
    const seg = el("div", {class:"seg"});
    for (let i = 1; i <= 8; i++)
      seg.append(el("button", {class: String(i) === d.v[k] ? "on" : "", text:i, disabled:env, onclick:() => {
        seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.textContent === String(i)));
        setVal(k, String(i)); }}));
    line.append(seg);
  } else if (f.type === "ctx"){
    const inp = textInput("num"); inp.inputMode = "numeric";
    const human = el("span", {class:"unit"});
    const chips = el("div", {class:"chips"});
    const sync = () => {
      const n = parseIntStrict(String(d.v[k]).trim());
      human.textContent = Number.isNaN(n) ? "tokens" : "tokens = " + fmtK(n);
      chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.v === String(n)));
    };
    for (const [lab, v] of [["32K",32768],["64K",65536],["128K",131072],["256K",262144],["512K",524288]])
      chips.append(el("span", {class:"chip", "data-v":String(v), text:lab, onclick:() => {
        if (env) return; inp.value = String(v); setVal(k, String(v)); sync(); }}));
    inp.addEventListener("input", sync);
    line.append(inp, human, chips);
    sync();
  } else if (f.type === "affinity"){
    const v = d.v[k] || "";
    const std = v === "" || v === "lower-half" || v === "upper-half";
    const cust = el("input", {type:"text", class:"num", value:std ? "" : v, placeholder:t("aff_ph"),
      disabled:env, style:std ? "display:none" : "", oninput:ev => setVal(k, ev.target.value)});
    const s = el("select", {disabled:env, onchange:ev => {
      const x = ev.target.value;
      cust.style.display = x === "custom" ? "" : "none";
      setVal(k, x === "custom" ? cust.value : x);
      if (x === "custom") cust.focus();
    }}, [["", t("aff_unset")], ["lower-half","lower-half（CCD0）"], ["upper-half","upper-half（CCD1）"],
         ["custom", t("aff_custom")]].map(o => el("option", {value:o[0], text:o[1]})));
    s.value = std ? v : "custom";
    line.append(s, cust);
  } else if (f.type === "file" || f.type === "dir"){
    const inp = textInput();
    const br = el("button", {class:"btn ghost mini", text:t("browse"), disabled:env,
      onclick:() => openBrowser(k, f.type)});
    if (f.opt){
      const enable = on => { d.on[k] = on; inp.disabled = env || !on; br.disabled = env || !on; changed(); };
      line.append(mkSwitch(!!d.on[k], env, enable, t("enable")));
      inp.disabled = env || !d.on[k]; br.disabled = env || !d.on[k];
    }
    line.append(inp, br, el("span", {class:"ex"}));
  } else {
    const inp = textInput(f.type === "int" ? "num" : "");
    if (f.type === "int") inp.inputMode = "numeric";
    line.append(inp);
    if (f.unit) line.append(el("span", {class:"unit", text:f.unit}));
  }
  if (env) line.append(el("span", {class:"envtag", text:t("env_tag"), title:t("env_help")}));
  line.append(el("button", {class:"iconbtn reset", title:t("reset"), text:"↺", onclick:() => resetField(k)}));
  ctl.append(el("div", {class:"fmsg"}));
  const help = L(f, "help");
  if (help) ctl.append(el("div", {class:"fhelp", text:help}));
  return row;
}

function mkSwitch(on, disabled, cb, label){
  const inp = el("input", {type:"checkbox", checked:on, disabled, onchange:ev => cb(ev.target.checked)});
  return el("label", {class:"sw"}, [inp, el("span", {class:"tr"}), label ? el("span", {class:"lb", text:label}) : null]);
}

function resetField(k){
  S.draft.v[k] = S.base.v[k];
  if (k in S.base.on) S.draft.on[k] = S.base.on[k];
  renderPane(); changed();
}

// 只刷新标记（不重建 DOM，避免打字时丢焦点）
function refreshMarks(){
  if (!S.draft) return;
  const dk = new Set(dirtyKeys()), errs = validate(S.draft);
  document.querySelectorAll(".frow[data-k]").forEach(row => {
    const k = row.dataset.k, f = FMAP[k];
    row.classList.toggle("dirty", dk.has(k));
    row.classList.toggle("bad", !!errs[k]);
    const msg = row.querySelector(".fmsg");
    msg.className = "fmsg"; msg.textContent = "";
    if (errs[k]){ msg.className = "fmsg err"; msg.textContent = errs[k]; }
    else if (k === "MAX_CONTEXT" && parseIntStrict(eff(S.draft, k)) > 262144){
      msg.className = "fmsg info"; msg.textContent = t("yarn");
    }
    const ex = row.querySelector(".ex");
    if (ex){
      ex.className = "ex"; ex.textContent = "";
      const p = eff(S.draft, k);
      const q = f.tok ? p.replace(/[\\/]+$/, "") + "/tokenizer.json" : p;
      const r = p ? S.ex[q] : null;
      if (r && !errs[k]){
        const good = f.type === "dir" && !f.tok ? r.is_dir : (r.exists && !r.is_dir);
        ex.className = "ex " + (good ? "ok" : "no");
        ex.textContent = good ? t("ex_ok") : (f.tok ? t("ex_notok") : f.type === "dir" ? t("ex_nodir") : t("ex_no"));
      }
    }
  });
}

let checkTimer = null;
function scheduleCheck(){
  clearTimeout(checkTimer);
  checkTimer = setTimeout(async () => {
    const paths = new Set();
    for (const f of FIELDS){
      if ((f.type !== "file" && f.type !== "dir") || !fieldVisible(f, S.draft.wv)) continue;
      const p = eff(S.draft, f.k);
      if (!p) continue;
      paths.add(f.tok ? p.replace(/[\\/]+$/, "") + "/tokenizer.json" : p);
    }
    const list = [...paths].filter(p => !(p in S.ex));
    if (!list.length){ refreshMarks(); return; }
    try{
      const res = await api("/api/check", "POST", {paths:list});
      for (const r of res) S.ex[r.path] = {exists:!!r.exists, is_dir:!!r.is_dir};
    }catch(e){}
    refreshMarks();
  }, 350);
}

function changed(){
  refreshMarks(); renderTabs(); renderSavebar(); renderSide(); renderHeader(); scheduleCheck();
}

function preflight(){
  const c = S.cfg, out = [];
  if (!c) return out;
  const wv = c.weights_ver || "v2", fl = c.files || {};
  for (const k of PF_WKEYS[wv]){
    if (k === "TOKENIZER_DIR") continue;
    const f = fl[k]; if (!f) continue;
    if (!f.path) out.push({k, st: f.optional ? "skip" : "bad", note: f.optional ? t("ck_off") : t("ck_empty")});
    else out.push({k, st: f.exists ? "ok" : "bad", note: f.path});
  }
  if (wv !== "gguf" && fl.TOKENIZER_JSON)
    out.push({k:"TOKENIZER_JSON", st: fl.TOKENIZER_JSON.exists ? "ok" : "bad", note: fl.TOKENIZER_JSON.path});
  for (const [k, v] of Object.entries(c.binaries || {}))
    out.push({k, st: v ? "ok" : "bad", note: v ? "" : t("ck_missing")});
  if (!ACTIVE.includes(S.svc.state) && c.ports){
    out.push({k:"eport", st: c.ports.engine_free ? "ok" : "bad", note: c.ports.engine + " " + (c.ports.engine_free ? t("ck_free") : t("ck_busy"))});
    out.push({k:"aport", st: c.ports.api_free ? "ok" : "bad", note: c.ports.api + " " + (c.ports.api_free ? t("ck_free") : t("ck_busy"))});
  }
  return out;
}

// 运行页：结构只建一次，状态与预检由 fillRun() 原地刷新（不动日志区，保住滚动位置）
function fillRun(){
  const box = $("#runStatus"), pre = $("#runPre");
  if (!box || !pre) return;
  const st = S.svc.state || "idle";
  const det = [];
  if (S.svc.detail) det.push(S.svc.detail);
  if (S.svc.engine?.external) det.push(t("ext_engine"));
  if (S.svc.engine?.log) det.push(S.svc.engine.log);
  if (S.svc.api?.external && S.svc.api?.up) det.push(t("ext_api"));
  const rp = LS.get("runpf");
  const stCls = st === "running" ? "var(--ok)" : ACTIVE.includes(st) ? "var(--warn)" :
                (st === "failed" || st === "exited") ? "var(--bad)" : "var(--dim)";
  box.replaceChildren(
    el("h4", {text:t("run_state")}),
    el("div", {class:"bigstate", style:"color:" + stCls, text:t("st")[st] || st}),
    ACTIVE.includes(st) && rp !== null && !S.svc.engine?.external
      ? el("div", {class:"kv", text:t("run_pf") + (rp || t("run_pf_none"))}) : "",
    el("div", {class:"kv", text:det.join("；")}),
    S.svc.api?.up && S.svc.console_url
      ? el("div", {class:"kv", style:"margin-top:6px"}, el("a", {href:S.svc.console_url, target:"_blank", text:S.svc.console_url})) : "");
  const pfBox = el("div", {class:"pf"});
  for (const it of preflight())
    pfBox.append(el("span", {class:"i " + it.st, text: it.st === "ok" ? "✓" : it.st === "bad" ? "✗" : "–"}),
      el("span", {class:"t", title:it.note}, [t("ck")[it.k] || it.k, " ", el("small", {text:it.note})]));
  pre.replaceChildren(
    el("h4", {}, [t("pre_title"), el("span", {style:"font-weight:400;color:var(--faint);margin-left:8px",
      text: ACTIVE.includes(st) ? t("pre_busy") : t("pre_note")})]),
    pfBox);
}

function renderRun(pane){
  pane.append(el("div", {class:"runtop"}, [el("div", {class:"box", id:"runStatus"}), el("div", {class:"box", id:"runPre"})]));
  fillRun();
  const seg = el("div", {class:"seg"});
  for (const w of ["engine","api","script","launcher"]){
    const b = el("button", {class: S.logWhich === w ? "on" : "", text:t("log_" + w), onclick:() => {
      S.logWhich = w; seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      S.follow = true; refreshLog(true); }});
    seg.append(b);
  }
  pane.append(el("div", {class:"logbar"}, [seg, el("span", {class:"path", id:"logPath"}),
    mkSwitch(S.follow, false, on => { S.follow = on; if (on) scrollLogEnd(); }, t("follow"))]));
  const pre = el("pre", {id:"log"});
  pre.addEventListener("scroll", () => {
    const atEnd = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 24;
    if (S.follow !== atEnd && !pre._prog){ S.follow = atEnd; const cb = pane.querySelector(".logbar .sw input"); if (cb) cb.checked = atEnd; }

function scrollLogEnd(){
  const pre = $("#log"); if (!pre) return;
  pre._prog = true; pre.scrollTop = pre.scrollHeight;
  setTimeout(() => { pre._prog = false; }, 50);
}
let logBusy = false;
async function refreshLog(force){
  if (S.tab !== "r" || logBusy) return;
  logBusy = true;
  try{
    const j = await api("/api/logs?which=" + S.logWhich);
    const pre = $("#log");
    if (pre){
      const text = j.text || "";
      if (force || pre.textContent !== text){
        pre.textContent = text;
        if (S.follow || force) scrollLogEnd();
      }
      const lp = $("#logPath"); if (lp) lp.textContent = j.path || "";
    }
  }catch(e){}
  logBusy = false;
}

// ============================================================================
// 对话框
// ============================================================================
function dialog({title, body, input, buttons}){
  return new Promise(resolve => {
    const host = $("#modalHost");
    let inp = null, hint = null;
    const close = v => { host.innerHTML = ""; document.removeEventListener("keydown", onKey, true); resolve(v); };
    const btnEls = buttons.map(b => el("button", {class:"btn " + (b.kind || "ghost"), text:b.label,
      onclick:() => { if (b.primary && inp && validateInput()) return; close(inp && b.primary ? inp.value.trim() : b.value); }}));
    const primary = buttons.findIndex(b => b.primary);
    const validateInput = () => {
      if (!inp) return false;
      const r = input.check(inp.value.trim()) || {};
      hint.className = "mh " + (r.level || "");
      hint.textContent = r.msg || "";
      if (primary >= 0){
        btnEls[primary].disabled = r.level === "err";
        if (r.label) btnEls[primary].textContent = r.label;
        else btnEls[primary].textContent = buttons[primary].label;
      }
      return r.level === "err";
    };
    const card = el("div", {class:"mcard"}, [el("h4", {text:title}), body ? el("div", {class:"mb", text:body}) : null]);
    if (input){
      inp = el("input", {type:"text", value:input.value || "", placeholder:input.placeholder || "",
        spellcheck:"false", oninput:validateInput});
      hint = el("div", {class:"mh"});
      card.append(inp, hint);
    }
    card.append(el("div", {class:"mbtns"}, btnEls));
    const modal = el("div", {class:"modal", onmousedown:ev => { if (ev.target === modal) close(null); }}, card);
    host.append(modal);
    const onKey = ev => {
      if (ev.key === "Escape"){ ev.preventDefault(); close(null); }
      else if (ev.key === "Enter" && primary >= 0 && !btnEls[primary].disabled &&
               (inp ? document.activeElement === inp : true)){ ev.preventDefault(); btnEls[primary].click(); }
    };
    document.addEventListener("keydown", onKey, true);
    if (inp){ validateInput(); inp.focus(); inp.select(); }
    else if (primary >= 0) btnEls[primary].focus();
  });
}
const confirmDlg = (title, body, okLabel, kind) => dialog({title, body,
  buttons:[{label:t("b_cancel"), value:false}, {label:okLabel || t("b_ok"), value:true, kind:kind || "", primary:true}]})
  .then(v => v === true);

function askName(title, body, init, exclude){
  return dialog({title, body,
    input:{value:init, placeholder:t("name_ph"), check:v => {
      if (!v) return {level:"err", msg:t("n_empty")};
      if (v.length > 64) return {level:"err", msg:t("n_long")};
      if (exclude !== undefined && v === exclude) return {level:"err", msg:t("n_same")};
      if (S.prof[v]) return {level:"warn", msg:t("n_dup"), label:t("b_overwrite")};
      return null;
    }},
    buttons:[{label:t("b_cancel"), value:null}, {label:t("b_ok"), kind:"", primary:true}]});
}

async function reloadCfg(){
  S.cfg = await api("/api/config");
  S.plat = S.cfg.platform || "windows";
  if (S.cfg.service) S.svc = {...S.svc, ...S.cfg.service};
}
async function reloadProfiles(){
  try{ S.prof = (await api("/api/profiles")).profiles || {}; }catch(e){ S.prof = {}; }
}
function resetDraft(){ S.base = draftFromCfg(); S.draft = clone(S.base); S.ex = {}; }
function renderAll(){ renderSide(); renderTabs(); renderPane(); renderSavebar(); renderHeader(); scheduleCheck(); }

function collectAll(){
  const vals = {};
  for (const f of FIELDS){
    if (!fieldOn(f) || isEnv(f.k)) continue;
    vals[f.k] = eff(S.draft, f.k);
  }
  return vals;
}
function markRestartIfActive(){ if (ACTIVE.includes(S.svc.state)) LS.set("restart", "1"); }

// 把草稿写进 service.conf；target 非空时再用规范化后的配置覆盖该方案
async function commit(target){
  await api("/api/config", "POST", {values:collectAll(), weights_ver:S.draft.wv});
  await reloadCfg();
  if (target){
    await api("/api/profiles", "POST", {name:target, data:profileFromCfg()});
    await reloadProfiles();
  }
  setSel(target || "");
  markRestartIfActive();
  resetDraft();
}

async function saveDraft(){
  if (!isDirty()) return true;
  if (Object.keys(validate(S.draft)).length){ toast(t("m_fixfirst"), true); return false; }
  try{
    const target = S.sel;
    await commit(target);
    toast((target ? t("m_saved_pf", {n:target}) : t("m_saved")) +
          (ACTIVE.includes(S.svc.state) ? t("m_saved_run") : ""));
    renderAll();
    return true;
  }catch(e){ toast(e.message, true); return false; }
}

function doRevert(){
  if (!S.base) return;
  S.draft = clone(S.base);
  renderAll();
}

async function doNew(){
  if (Object.keys(validate(S.draft)).length){ toast(t("m_fixfirst"), true); return; }
  const base = S.sel || (LANG === "zh" ? "新方案" : "New profile");
  let init = base, i = 2;
  while (S.prof[init]) init = base + " " + (i++);
  const name = await askName(t("d_new"), t("d_new_b"), init);
  if (!name) return;
  try{ await commit(name); toast(t("m_created", {n:name})); renderAll(); }
  catch(e){ toast(e.message, true); }
}
async function doStoreUnsaved(){
  const name = await askName(t("d_store"), t("d_store_b"), LANG === "zh" ? "默认" : "Default");
  if (!name) return;
  try{
    if (isDirty() && !Object.keys(validate(S.draft)).length) await commit(name);
    else {
      await api("/api/profiles", "POST", {name, data:profileFromCfg()});
      await reloadProfiles(); setSel(name);
    }
    toast(t("m_created", {n:name})); renderAll();
  }catch(e){ toast(e.message, true); }
}

async function doSwitch(name){
  if (name === S.sel) return;
  const dk = dirtyKeys();
  if (dk.length){
    const bad = Object.keys(validate(S.draft)).length > 0;
    const v = await dialog({title:t("d_switch"),
      body:t("d_switch_b", {a:S.sel || t("unsaved_name"), n:dk.length, b:name}),
      buttons:[{label:t("b_cancel"), value:null}, {label:t("b_discard"), value:"discard", kind:"danger"},
               ...(bad ? [] : [{label:t("b_save_go"), value:"save", kind:"", primary:true}])]});
    if (!v) return;
    if (v === "save" && !(await saveDraft())) return;
  }
  const data = S.prof[name];
  if (!data) return;
  const vals = {};
  for (const [k, v] of Object.entries(data)) if (k !== "weights_ver") vals[k] = String(v);
  try{
    await api("/api/config", "POST", {values:vals, weights_ver:data.weights_ver || "v2"});
    await reloadCfg();
    // 后端会规范化部分值（如 KV 池按最大上下文取整）：回写方案，保证与 conf 一致
    if (!profileMatches(data)){
      await api("/api/profiles", "POST", {name, data:profileFromCfg()});
      await reloadProfiles();
    }
    setSel(name); markRestartIfActive(); resetDraft();
    toast(t("m_switched", {n:name}) + (ACTIVE.includes(S.svc.state) ? t("m_saved_run") : ""));
    renderAll();
  }catch(e){ toast(e.message, true); }
}

async function doRename(old){
  const name = await askName(t("d_rename"), "", old, old);
  if (!name) return;
  try{
    await api("/api/profiles", "POST", {name, data:S.prof[old]});
    await api("/api/profiles/delete", "POST", {name:old});
    await reloadProfiles();
    if (S.sel === old) setSel(name);
    if (LS.get("runpf") === old) LS.set("runpf", name);
    toast(t("m_renamed", {n:name})); renderAll();
  }catch(e){ toast(e.message, true); }
}
async function doDup(src){
  let init = src + t("dup_suffix"), i = 2;
  while (S.prof[init]) init = src + t("dup_suffix") + " " + (i++);
  const name = await askName(t("d_dup"), t("d_dup_b", {n:src}), init);
  if (!name) return;
  try{
    await api("/api/profiles", "POST", {name, data:S.prof[src]});
    await reloadProfiles(); toast(t("m_dup", {n:name})); renderAll();
  }catch(e){ toast(e.message, true); }
}
async function doDelete(name){
  if (!(await confirmDlg(t("d_del", {n:name}), t("d_del_b"), t("b_delete"), "danger"))) return;
  try{
    await api("/api/profiles/delete", "POST", {name});
    await reloadProfiles();
    if (S.sel === name) setSel(pickSel());
    toast(t("m_deleted", {n:name})); renderAll();
  }catch(e){ toast(e.message, true); }
}

async function doStart(){
  if (isDirty() && !(await saveDraft())) return;
  try{ await reloadCfg(); }catch(e){}
  const bad = preflight().filter(x => x.st === "bad");
  if (bad.length){
    const list = bad.map(x => "· " + (t("ck")[x.k] || x.k) + (x.note ? "  " + x.note : "")).join("\n");
    if (!(await confirmDlg(t("pre_title"), t("pre_fail", {list}), t("b_start_anyway"), "warnb"))) return;
  }
  try{
    await api("/api/start", "POST", {});
    LS.set("restart", null); LS.set("runpf", S.sel);
    toast(t("m_starting"));
    gotoTab("r");
  }catch(e){ toast(e.message, true); }
  pollStatus();
}
async function doStop(){
  if (!(await confirmDlg(t("d_stop"), t("d_stop_b"), t("b_stop"), "danger"))) return;
  try{ await api("/api/stop", "POST", {}); toast(t("m_stopping")); }
  catch(e){ toast(e.message, true); }
  pollStatus();
}
async function doRestart(){
  if (isDirty() && !(await saveDraft())) return;
  if (!(await confirmDlg(t("d_restart"), t("d_restart_b"), t("b_restart"), "warnb"))) return;
  try{ await api("/api/stop", "POST", {}); toast(t("m_stopping")); }
  catch(e){ toast(e.message, true); return; }
  const t0 = Date.now();
  while (Date.now() - t0 < 60000){
    await new Promise(r => setTimeout(r, 700));
    await pollStatus();
    if (!ACTIVE.includes(S.svc.state)) break;
  }
  if (ACTIVE.includes(S.svc.state)){ toast(t("m_restart_to"), true); return; }
  try{
    await reloadCfg();
    await api("/api/start", "POST", {});
    LS.set("restart", null); LS.set("runpf", S.sel);
    toast(t("m_starting")); gotoTab("r");
  }catch(e){ toast(e.message, true); }
  pollStatus();
}

async function doQuit(){
  const active = ACTIVE.includes(S.svc.state);
  if (active && !(await confirmDlg(t("d_quit"), t("d_quit_b"), t("b_quit"), "danger"))) return;
  try{ await api("/api/shutdown" + (active ? "?force=1" : ""), "POST", {}); }catch(e){}
  window.onbeforeunload = null;
  document.body.innerHTML = `<p style="position:relative;padding:40px;text-align:center;color:#9aa6c0">${t("quit_done")}</p>`;
}

async function doPowerHigh(){
  try{
    const j = await api("/api/power_high", "POST", {});
    if (j.ok){ toast(t("pw_done")); }
    else toast(t("pw_fail") + (j.error ? "：" + j.error : ""), true);
    S.power = j;
    renderHeader();
  }catch(e){ toast(t("pw_fail") + "：" + e.message, true); }
}

let lastState = null;
async function pollStatus(){
  try{ S.svc = await api("/api/status"); }catch(e){ return; }
  try{
    const p = await api("/api/power_scheme");
    if (JSON.stringify([p.supported, p.is_high, p.scheme]) !== S._pwsig){
      S._pwsig = JSON.stringify([p.supported, p.is_high, p.scheme]);
      S.power = p;
    }
  }catch(e){}
  const st = S.svc.state;
  if (!ACTIVE.includes(st)) LS.set("restart", null);  // 没在运行就谈不上"需要重启"
  renderHeader();
  if (st !== lastState){
    lastState = st;
    renderTabs(); renderSide();
    if (S.tab === "r"){ try{ await reloadCfg(); }catch(e){} }  // 状态变了：预检（端口等）重新取
  }
  if (S.tab === "r") fillRun();  // 原地刷新状态详情（加载进度等）
}

// ============================================================================
// 文件浏览器
// ============================================================================
const FB = {key:null, mode:"file", path:"", root:"", exts:[], cur:""};
function fmtSize(n){
  if (n === undefined) return "";
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "G";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return n + "B";
}
function fmtTime(ts){
  if (!ts) return "";
  const d = new Date(ts * 1000), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// 项目根内 → ./相对路径；外部 → 绝对路径
function fbDisplayPath(abs){
  const root = (FB.root || "").replace(/\\/g, "/").replace(/\/+$/, ""), p = abs.replace(/\\/g, "/");
  if (root && p === root) return ".";
  if (root && p.startsWith(root + "/")) return "./" + p.slice(root.length + 1);
  return p;
}
function openBrowser(key, mode){
  FB.key = key; FB.mode = mode; FB.exts = FMAP[key].ext || [];
  const cur = String(S.draft.v[key] || "").trim().replace(/\\/g, "/");
  FB.cur = baseName(cur);
  let dir = cur;
  if (mode !== "dir") dir = cur.includes("/") ? cur.slice(0, cur.lastIndexOf("/")) : "";
  const host = $("#modalHost");
  const filt = el("select", {style: FB.exts.length ? "min-width:0" : "display:none",
    onchange:() => fbLoad(FB.path).catch(fbErr)},
    FB.exts.length ? [el("option", {value:"auto", text:"*" + FB.exts.join(" ")}), el("option", {value:"", text:t("fb_all")})] : []);
  const pathInp = el("input", {type:"text", id:"fbPath", spellcheck:"false",
    onkeydown:ev => { if (ev.key === "Enter") fbLoad(ev.target.value.trim()).catch(fbErr); }});
  const win = S.plat === "windows";
  const card = el("div", {class:"fbcard"}, [
    el("div", {class:"fb-toolbar"}, [el("button", {class:"btn ghost mini", text:"↑", onclick:fbUp}), pathInp, filt]),
    el("div", {class:"fb-chips"}, [
      el("button", {class:"btn ghost mini", text:t("fb_root"), onclick:() => fbLoad("").catch(fbErr)}),
      el("button", {class:"btn ghost mini", text:"models", onclick:() => fbLoad("models").catch(fbErr)}),
      el("button", {class:"btn ghost mini", text: win ? t("fb_drives") : "/", onclick:() => fbLoad(win ? "@drives" : "/").catch(fbErr)}),
    ]),
    el("div", {class:"fb-list", id:"fbList"}),
    el("div", {class:"fb-foot"}, [
      el("span", {class:"small", text: mode === "dir" ? t("fb_hint_dir") : t("fb_hint_file")}),
      el("span", {class:"spacer"}),
      mode === "dir" ? el("button", {class:"btn", text:t("fb_pick"), onclick:() => fbPick(FB.path)}) : null,
      el("button", {class:"btn ghost", text:t("b_cancel"), onclick:fbClose}),
    ]),
  ]);
  FB.filt = filt;
  const modal = el("div", {class:"modal", onmousedown:ev => { if (ev.target === modal) fbClose(); }}, card);
  host.innerHTML = ""; host.append(modal);
  FB.onKey = ev => { if (ev.key === "Escape") fbClose(); };
  document.addEventListener("keydown", FB.onKey);
  const tryLoad = p => fbLoad(p).catch(() => {
    if (!p || p === "@drives") return fbErr({message:"root"});
    tryLoad(p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "");
  });
  tryLoad(dir);
}
function fbClose(){ $("#modalHost").innerHTML = ""; document.removeEventListener("keydown", FB.onKey); }
function fbErr(e){
  const l = $("#fbList");
  if (l) l.replaceChildren(el("div", {class:"small", style:"padding:12px;color:var(--bad)", text:e.message}));
}
async function fbLoad(path){
  const j = await api("/api/files?path=" + encodeURIComponent(path));
  FB.path = j.path; FB.root = j.root || FB.root;
  $("#fbPath").value = j.path === "@drives" ? "" : j.path;
  const list = $("#fbList");
  list.innerHTML = "";
  const auto = FB.filt.value === "auto";
  const join = (b, n) => b === "@drives" ? n : b.endsWith("/") ? b + n : b + "/" + n;
  const mk = (icon, name, fn, size, mtime) => list.append(el("div",
    {class:"fb-item" + (name === FB.cur ? " cur" : ""), onclick:fn},
    [el("span", {text:icon}), el("span", {class:"nm", text:name}),
     el("span", {class:"sz", text:size !== undefined ? fmtSize(size) : ""}), el("span", {class:"mt", text:fmtTime(mtime)})]));
  for (const d of j.dirs) mk("📁", d.name, () => fbLoad(join(j.path, d.name)).catch(fbErr), undefined, d.mtime);
  if (FB.mode !== "dir")
    for (const f of j.files){
      if (auto && FB.exts.length && !FB.exts.some(e => f.name.toLowerCase().endsWith(e))) continue;
      mk("📄", f.name, () => fbPick(join(j.path, f.name)), f.size, f.mtime);
    }
  if (!list.children.length) list.append(el("div", {class:"small", style:"padding:12px", text:t("fb_empty")}));
}
function fbUp(){
  if (FB.path === "@drives") return fbLoad("").catch(fbErr);
  const p = FB.path.replace(/\/+$/, "");
  if (!p) return;
  const i = p.lastIndexOf("/");
  let up = i <= 0 ? "/" : p.slice(0, i);
  if (/^[A-Za-z]:$/.test(up) || up === p) up = S.plat === "windows" ? "@drives" : "/";
  fbLoad(up).catch(fbErr);
}
function fbPick(abs){
  const k = FB.key;
  S.draft.v[k] = fbDisplayPath(abs);
  if (FMAP[k].opt) S.draft.on[k] = true;
  fbClose(); renderPane(); changed();
}

// ---- 操作互斥：一次只跑一个动作（防止保存未完成时又点保存/切换/重启而重复提交） ----
let BUSY = false;
const act = fn => async (...a) => {
  if (BUSY) return;
  BUSY = true;
  document.body.style.cursor = "progress";
  try{ return await fn(...a); }
  finally{ BUSY = false; document.body.style.cursor = ""; }
};
const doSave = act(saveDraft);
doSwitch = act(doSwitch); doNew = act(doNew); doStoreUnsaved = act(doStoreUnsaved);
doRename = act(doRename); doDup = act(doDup); doDelete = act(doDelete);
doStart = act(doStart); doStop = act(doStop); doRestart = act(doRestart); doQuit = act(doQuit);

// ============================================================================
// 全局事件 / 启动
// ============================================================================
$("#btnNew").addEventListener("click", doNew);
$("#btnQuit").addEventListener("click", doQuit);
$("#langBtn").addEventListener("click", async () => {
  LANG = LANG === "zh" ? "en" : "zh";
  try{ await api("/api/config", "POST", {values:{}, lang:LANG}); }catch(e){}
  applyLang(); renderAll();
});
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && (ev.key === "s" || ev.key === "S")){
    ev.preventDefault();
    if (!$("#modalHost").children.length) doSave();
  }
});
window.onbeforeunload = ev => { if (isDirty()){ ev.preventDefault(); ev.returnValue = t("leave"); return t("leave"); } };

function applyLang(){
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.title = LANG === "zh" ? "Qwenox 启动器" : "Qwenox Launcher";
  $("#langBtn").textContent = LANG === "zh" ? "EN" : "中文";
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
}

(async () => {
  try{
    await reloadCfg();
    LANG = S.cfg.lang || "zh";
    applyLang();
    await reloadProfiles();
    setSel(pickSel());
    resetDraft();
    renderAll();
    await pollStatus();
  }catch(e){ toast(e.message, true); }
  setInterval(pollStatus, 2000);
  setInterval(() => { if (S.tab === "r") refreshLog(false); }, 2500);
})();
</script>
